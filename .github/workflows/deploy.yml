name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        working-directory: ./bot
        run: npm ci

      - name: Build TypeScript
        working-directory: ./bot
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "bot/dist" ]; then
            echo "Build failed: bot/dist not found"
            exit 1
          fi
          echo "Build successful"
          ls -la bot/dist/

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: SSH_HOST

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /opt/wibecode-bot
            git pull origin main
            pip3 install -r requirements.txt --break-system-packages -q 2>/dev/null || true
            cd bot
            npm install --omit=dev
            npm run build
            pm2 restart wibecode-bot || pm2 start ../ecosystem.config.js --only telegram-rpg-bot --env production
            pm2 save
            echo "Deploy complete. Bot status:"
            pm2 status

  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Wait for server restart
        run: sleep 10

      - name: Check health endpoint
        run: |
          echo "Checking health endpoint..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://yakutsa.ru/health || echo "000")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Health check passed"
          else
            echo "Health check failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Notify on success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.NOTIFY_CHAT_ID }}" \
            -d text="Deploy successful — $(date -u '+%Y-%m-%d %H:%M UTC')%0ACommit: ${{ github.sha }}" \
            -d parse_mode="HTML" 2>/dev/null || echo "Notification skipped (no bot token)"

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.NOTIFY_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.NOTIFY_CHAT_ID }}" \
            -d text="Deploy health check FAILED — $(date -u '+%Y-%m-%d %H:%M UTC')%0ACommit: ${{ github.sha }}" \
            -d parse_mode="HTML" 2>/dev/null || echo "Notification skipped (no bot token)"
