name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bot-build-and-test:
    name: Bot — Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        working-directory: ./bot
        run: npm ci

      - name: Build TypeScript
        working-directory: ./bot
        run: npm run build

      - name: Run tests
        working-directory: ./bot
        run: npx vitest run --reporter=verbose

      - name: Lint (if eslint configured)
        working-directory: ./bot
        run: npm run lint 2>/dev/null || echo "Lint skipped (no eslint config)"
        continue-on-error: true

  python-tests:
    name: Python — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip install pytest

      - name: Run Python tests
        run: python -m pytest tools/tests/ -v

  mini-app-build:
    name: Mini App — Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mini-app/package-lock.json

      - name: Install dependencies
        working-directory: ./mini-app
        run: npm ci

      - name: Build
        working-directory: ./mini-app
        run: npm run build

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [bot-build-and-test, python-tests]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Post test summary
        uses: actions/github-script@v7
        with:
          script: |
            const botResult = '${{ needs.bot-build-and-test.result }}';
            const pythonResult = '${{ needs.python-tests.result }}';
            const botIcon = botResult === 'success' ? '✅' : '❌';
            const pyIcon = pythonResult === 'success' ? '✅' : '❌';

            const body = [
              '## Test Results',
              '',
              `| Suite | Status |`,
              `|-------|--------|`,
              `| TypeScript (Vitest) | ${botIcon} ${botResult} |`,
              `| Python (pytest) | ${pyIcon} ${pythonResult} |`,
              '',
              `*Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
